name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Verify eval seeds and harnesses (syntactic only, no LLM runs)
        env:
          WFPORT_NO_UPDATE_CHECK: "1"
        run: |
          for f in test/eval/seeds/seed.claude.js test/eval/seeds/seed.muse.js test/eval/seeds/seed.grok.rhai test/eval/harness/harness.claude.js test/eval/harness/harness.muse.js test/eval/harness/harness.grok.rhai; do
            bun bin/cli.mjs verify "$f" --format agent
          done

  smoke:
    needs: verify
    env:
      WFPORT_NO_UPDATE_CHECK: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          ./dist/wfport test/fixtures/sample.workflow.js.txt --to muse --out /tmp/smoke.muse.js --report /tmp/smoke.json || test $? -eq 2
          ./dist/wfport test/fixtures/sample.workflow.js.txt --to grok --out /tmp/smoke.rhai --report /tmp/smoke-grok.json || test $? -eq 2
          ./dist/wfport /tmp/smoke.muse.js -o grok --out /tmp/smoke-back.rhai --report /tmp/smoke-back.json || test $? -eq 2
          test -s /tmp/smoke.muse.js
          test -s /tmp/smoke.rhai
          test -s /tmp/smoke-back.rhai

  cross-compile:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
